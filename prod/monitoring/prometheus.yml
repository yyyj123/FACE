global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/face-alerts.yml

scrape_configs:
  - job_name: face-backend
    metrics_path: /face-next/actuator/prometheus
    static_configs:
      - targets: ["backend:8090"]
  - job_name: face-backup
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
