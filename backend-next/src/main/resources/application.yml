server:
  port: ${SERVER_PORT:8090}
  forward-headers-strategy: framework
  servlet:
    context-path: /face-next
  shutdown: graceful

spring:
  application:
    name: face-chain-platform
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3308/face_salon?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:face_app}
    password: ${DB_PASSWORD:${db_password:}}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 5000
      validation-timeout: 3000
      keepalive-time: 60000
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-migration-naming: true
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        readiness:
          include: readinessState,db,databaseContract
        liveness:
          include: livenessState

face:
  business:
    mode: ${BUSINESS_MODE:SINGLE_SHOP}
    default-shop-id: ${DEFAULT_SHOP_ID:1}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:8081,http://localhost:8081,http://127.0.0.1:8082,http://localhost:8082,http://127.0.0.1:8083,http://localhost:8083,http://127.0.0.1:8084,http://localhost:8084,http://127.0.0.1:8085,http://localhost:8085,http://127.0.0.1:5173,http://localhost:5173}
  security:
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P30D}
  sms:
    mode: ${SMS_MODE:disabled}
    http:
      endpoint: ${SMS_HTTP_ENDPOINT:}
      bearer-token: ${SMS_HTTP_BEARER_TOKEN:${sms_http_bearer_token:}}
  payment:
    sandbox-secret: ${FACE_PAYMENT_SANDBOX_SECRET:${payment_sandbox_secret:}}
  media:
    storage-path: ${FACE_MEDIA_STORAGE_PATH:./data/media}
