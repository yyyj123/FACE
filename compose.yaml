name: face-salon

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: face_salon
      MYSQL_USER: face_app
      MYSQL_PASSWORD: ${FACE_DB_PASSWORD:?FACE_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${FACE_DB_ROOT_PASSWORD:?FACE_DB_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/database/face_salon_mysql8.sql:/docker-entrypoint-initdb.d/001_face_salon_base.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql -N -h 127.0.0.1 -uroot face_salon -e 'SELECT 1 FROM shop LIMIT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - database
    security_opt:
      - no-new-privileges:true

  migration:
    image: face-salon/migration:${FACE_IMAGE_TAG:-local}
    build:
      context: ./backend-next
      dockerfile: Dockerfile
      target: build
    entrypoint: ["mvn", "-B", "-ntp"]
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/face_salon?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      FLYWAY_USER: root
      FLYWAY_PASSWORD: ${FACE_DB_ROOT_PASSWORD:?FACE_DB_ROOT_PASSWORD is required}
      FLYWAY_LOCATIONS: filesystem:/workspace/src/main/resources/db/migration
      FLYWAY_CONNECT_RETRIES: 30
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "0"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - database
    profiles:
      - tools
    security_opt:
      - no-new-privileges:true

  backend:
    image: face-salon/backend:${FACE_IMAGE_TAG:-local}
    build:
      context: ./backend-next
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: 8090
      DB_URL: jdbc:mysql://mysql:3306/face_salon?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: face_app
      DB_PASSWORD: ${FACE_DB_PASSWORD:?FACE_DB_PASSWORD is required}
      DB_POOL_MAX: ${FACE_DB_POOL_MAX:-20}
      DB_POOL_MIN: ${FACE_DB_POOL_MIN:-2}
      BUSINESS_MODE: ${BUSINESS_MODE:-SINGLE_SHOP}
      DEFAULT_SHOP_ID: ${DEFAULT_SHOP_ID:-1}
      SMS_MODE: ${SMS_MODE:-disabled}
      SMS_HTTP_ENDPOINT: ${SMS_HTTP_ENDPOINT:-}
      SMS_HTTP_BEARER_TOKEN: ${SMS_HTTP_BEARER_TOKEN:-}
      FACE_PAYMENT_DEMO_MOCK_ENABLED: ${FACE_PAYMENT_DEMO_MOCK_ENABLED:-false}
      FACE_PAYMENT_DEMO_MOCK_SECRET: ${FACE_PAYMENT_DEMO_MOCK_SECRET:-}
      FACE_SC6_FULFILLMENT_SCAN_MS: ${FACE_SC6_FULFILLMENT_SCAN_MS:-300000}
      FACE_MEDIA_STORAGE_PATH: /app/data/media
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:${FACE_ADMIN_PORT:-8081},http://localhost:${FACE_ADMIN_PORT:-8081},http://127.0.0.1:${FACE_CLIENT_PORT:-8082},http://localhost:${FACE_CLIENT_PORT:-8082},http://127.0.0.1:${FACE_TECHNICIAN_PORT:-8083},http://localhost:${FACE_TECHNICIAN_PORT:-8083}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${FACE_BACKEND_PORT:-8090}:8090"
    volumes:
      - media_data:/app/data/media
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8090/face-next/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - application
      - database
    security_opt:
      - no-new-privileges:true

  admin:
    image: face-salon/admin:${FACE_IMAGE_TAG:-local}
    build:
      context: ./admin-next
      dockerfile: Dockerfile
      args:
        VITE_CHAIN_API: /face-next
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FACE_ADMIN_PORT:-8081}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - application
    security_opt:
      - no-new-privileges:true

  client:
    image: face-salon/client:${FACE_IMAGE_TAG:-local}
    build:
      context: ./front-next
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FACE_CLIENT_PORT:-8082}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - application
    security_opt:
      - no-new-privileges:true

  technician:
    image: face-salon/technician:${FACE_IMAGE_TAG:-local}
    build:
      context: ./front-next
      dockerfile: Dockerfile
      args:
        VITE_PORTAL_MODE: technician
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FACE_TECHNICIAN_PORT:-8083}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - application
    security_opt:
      - no-new-privileges:true

volumes:
  mysql_data:
  media_data:

networks:
  application:
  database:
    internal: true
