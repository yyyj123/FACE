map $http_x_forwarded_proto $demo_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-store" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
    }

    location = /demo/session {
        limit_except POST { deny all; }
        proxy_pass http://backend:8090/face-next/api/v3/demo/access/session;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $demo_forwarded_proto;
        proxy_set_header Origin "";
    }

    location = /demo/check {
        limit_except GET { deny all; }
        proxy_pass http://backend:8090/face-next/api/v3/demo/access/check;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $demo_forwarded_proto;
    }

    location = /_demo_auth {
        internal;
        proxy_pass http://backend:8090/face-next/api/v3/demo/access/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Proto $demo_forwarded_proto;
        proxy_set_header Origin "";
    }

    location = /admin { return 308 /admin/; }
    location /admin/assets/ {
        proxy_pass http://admin:8080/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location /admin/ {
        auth_request /_demo_auth;
        error_page 401 = @demo_gate_redirect;
        proxy_pass http://admin:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $demo_forwarded_proto;
    }

    location = /client { return 308 /client/; }
    location /client/assets/ {
        proxy_pass http://client:8080/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location /client/ {
        auth_request /_demo_auth;
        error_page 401 = @demo_gate_redirect;
        proxy_pass http://client:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $demo_forwarded_proto;
    }

    location = /api { return 308 /api/; }
    location /api/ {
        auth_request /_demo_auth;
        proxy_pass http://backend:8090/face-next/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $demo_forwarded_proto;
        proxy_set_header Origin "";
        proxy_read_timeout 60s;
    }

    location /face-next/upload/ {
        auth_request /_demo_auth;
        proxy_pass http://backend:8090;
        proxy_set_header Host $host;
    }

    location /images/ {
        proxy_pass http://client:8080/images/;
        proxy_set_header Host $host;
    }

    location /technician/ {
        return 404;
    }

    location @demo_gate_redirect {
        return 302 /?next=$request_uri;
    }

    location / {
        return 404;
    }
}
